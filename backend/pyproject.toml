[project]
name = "anywayone-backend"
version = "0.1.0"
description = "FastAPI backend for Anywayone Blog"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "markdown-it-py>=4,<5",
  "nh3>=0.3,<1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.35,<2",
  "httpx>=0.28,<1",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["app", "tests"]
exclude = ["alembic"]
venvPath = "."
venv = ".venv"
reportUnusedFunction = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
