name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    name: Quality gate
    if: github.repository == 'Anyway-one/Anywayone-blog'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.service }} image
    if: github.repository == 'Anyway-one/Anywayone-blog'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            dockerfile: web/Dockerfile
            image: anywayone-web
            build_args: |
              NEXT_PUBLIC_SITE_URL=https://www.anywayone.com
              NEXT_PUBLIC_API_BASE_URL=https://api.anywayone.com/api/v1
          - service: admin
            context: .
            dockerfile: admin/Dockerfile
            image: anywayone-admin
            build_args: |
              VITE_API_BASE_URL=https://api.anywayone.com/api/v1
              VITE_WEB_URL=https://www.anywayone.com
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
            image: anywayone-backend
            build_args: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/anyway-one/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/anyway-one/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-arm64
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy to Oracle Cloud
    if: github.repository == 'Anyway-one/Anywayone-blog' && vars.PRODUCTION_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" >"${HOME}/.ssh/anywayone_deploy"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/anywayone_deploy" "${HOME}/.ssh/known_hosts"

      - name: Package deployment configuration
        run: tar -czf "${RUNNER_TEMP}/anywayone-deploy.tar.gz" -C deploy compose.yml Caddyfile scripts

      - name: Upload deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: >-
          scp
          -i "${HOME}/.ssh/anywayone_deploy"
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o ConnectTimeout=15
          -P "${DEPLOY_PORT}"
          "${RUNNER_TEMP}/anywayone-deploy.tar.gz"
          "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/anywayone-deploy-${GITHUB_SHA}.tar.gz"

      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "${HOME}/.ssh/anywayone_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "tar -xzf /tmp/anywayone-deploy-${GITHUB_SHA}.tar.gz -C /opt/anywayone && \
             rm /tmp/anywayone-deploy-${GITHUB_SHA}.tar.gz && \
             chmod 750 /opt/anywayone/scripts/deploy.sh && \
             IMAGE_TAG=sha-${GITHUB_SHA} /opt/anywayone/scripts/deploy.sh"
